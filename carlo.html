  var seed = unopened && d.standard && d.standard.sections && d.standard.sections.length ? { mode: 'open', sections: d.standard.sections, zone: '', note: '' } : unopened ? { mode: 'open', sections: [{ start: PL.earliest, end: PL.doneBy, mode: 'route', offer: [] }], zone: '', note: '' } : d;
  show('<h1>' + esc(d.label) + '</h1><p class="muted">' + (unopened ? 'Not opened: customers cannot book this day. Set it below and save to open it.' : d.custom ? (PL.autoWeek ? 'You set this day by hand.' : 'Open. Customers can book it as set below.') : 'Following your standard ' + esc(d.label.split(' ')[0]) + '.') + (d.booked ? ' ' + d.booked + ' already booked; changing the day does not move or cancel them.' : '') + '</p>' + planEditor(seed, false) +
    '<div class="row"><button class="btn" id="dySave">' + (unopened ? 'Open this day' : 'Save this day') + '</button>' + (d.custom ? '<button class="btn ghost" id="dyReset">' + (PL.autoWeek ? 'Back to my standard week' : 'Close this day') + '</button>' : '') + '<button class="btn quiet" id="dyBack">Cancel</button></div><p class="err" id="dyErr" hidden></p>' +
    '<p class="muted small" style="margin-top:18px">Running an event at a venue this day instead? <button class="sbtn" id="dyEvent" type="button">Make it an event day</button></p>');
  wireEditor(seed);
  document.getElementById('dyEvent').addEventListener('click', function () { eventScreen(null, { date: d.date }); });
  document.getElementById('dyBack').addEventListener('click', function () { plannerScreen(); });
  function send(body, done) {
    body.op = 'saveplan'; body.date = d.date;
    post(body).then(function (r) { if (r.ok) return plannerScreen(done, r); var e2 = document.getElementById('dyErr'); e2.textContent = r.error || 'Could not save.'; e2.hidden = false; })
      .catch(function () { var e3 = document.getElementById('dyErr'); e3.textContent = 'Could not reach the engine.'; e3.hidden = false; });
  }
  document.getElementById('dySave').addEventListener('click', function () {
    var v = readEditor(); if (v.error) { var e2 = document.getElementById('dyErr'); e2.textContent = v.error; e2.hidden = false; return; }
    send(v, (v.mode === 'closed' ? 'Closed ' : 'Saved ') + d.label + '.');
  });
  var rs = document.getElementById('dyReset'); if (rs) rs.addEventListener('click', function () { send({ mode: 'default' }, PL.autoWeek ? d.label + ' is back to your standard week.' : d.label + ' is closed again.'); });
}
/* ── Events: a venue day with fixed appointment slots ── */
var EVB = [];
function drawBlackouts() {
  var box = document.getElementById('evBlk'); if (!box) return;
  box.innerHTML = EVB.map(function (b, i) {
    return '<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px"><div><label for="evBs' + i + '">No appointments from</label><input id="evBs' + i + '" type="time" step="900" value="' + esc(b.start) + '"></div><div><label for="evBe' + i + '">Until</label><input id="evBe' + i + '" type="time" step="900" value="' + esc(b.end) + '"></div><button class="sbtn warn" type="button" data-bx="' + i + '" style="margin-bottom:2px">Remove</button></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('[data-bx]'), function (b) { b.addEventListener('click', function () { syncBlackouts(); EVB.splice(+b.getAttribute('data-bx'), 1); drawBlackouts(); }); });
}
function syncBlackouts() { EVB.forEach(function (b, i) { var a = document.getElementById('evBs' + i), z = document.getElementById('evBe' + i); if (a) b.start = a.value; if (z) b.end = z.value; }); }
function linkBox(link) {
  return link ? '<label for="evLink">Booking link for this event</label><input id="evLink" readonly value="' + esc(link) + '"><div class="acts"><button class="sbtn go" id="evCopy" type="button">Copy link</button>' + (navigator.share ? '<button class="sbtn" id="evShare" type="button">Share</button>' : '') + '</div>' : '';
}
function wireLink(link, title) {
  var c = document.getElementById('evCopy'); if (!c) return;
  c.addEventListener('click', function () {
    var done = function () { c.textContent = 'Copied'; setTimeout(function () { c.textContent = 'Copy link'; }, 1600); };
    try { navigator.clipboard.writeText(link).then(done, function () { document.getElementById('evLink').select(); }); } catch (e) { document.getElementById('evLink').select(); }
  });
  var sh = document.getElementById('evShare'); if (sh) sh.addEventListener('click', function () { try { navigator.share({ title: title, url: link }); } catch (e) {} });
}
function eventScreen(d, seed) {
  seed = seed || {};
  var isNew = !(d && d.mode === 'event'), ev = (d && d.event) || seed.event || {};
  var date = seed.date || (d && d.date) || '';
  EVB = (ev.blackouts || []).map(function (b) { return { start: pad5(b.start), end: pad5(b.end) }; });
  show('<h1>' + (isNew ? 'Add an event' : esc(d.label)) + '</h1>' +
    '<p class="muted">' + (isNew ? 'An event is a day at a venue with back-to-back appointment slots. Customers near it see it under Sharpening, and you get a link that goes straight to it.' : 'Event day.' + (d.booked ? ' ' + d.booked + ' already booked. Their times stay exactly as they are, and no new slot will overlap them.' : '')) + '</p>' +
    (isNew ? '<label for="evDate">Day</label><input id="evDate" type="date" value="' + esc(date) + '">' : '') +
    '<label for="evVenue">Venue name</label><input id="evVenue" value="' + esc(ev.venue || '') + '" placeholder="Stoneridge Mall">' +
    '<label for="evAddr">Address (street, city, zip)</label><input id="evAddr" value="' + esc(ev.address || '') + '" placeholder="1 Stoneridge Mall Rd, Pleasanton, CA 94588">' +
    '<label for="evFind">Where to find you there (optional)</label><input id="evFind" value="' + esc(ev.findMe || '') + '" placeholder="In front of the MAC store">' +
    '<div class="two"><div><label for="evStart">First appointment</label><input id="evStart" type="time" step="900" value="' + esc(pad5(seed.start || (d && d.mode === 'event' ? d.start : '') || '10:00')) + '"></div><div><label for="evEnd">Day ends</label><input id="evEnd" type="time" step="900" value="' + esc(pad5(seed.end || (d && d.mode === 'event' ? d.end : '') || '18:00')) + '"></div></div>' +
    '<label for="evSlot">Minutes per appointment</label><input id="evSlot" inputmode="numeric" value="' + esc(ev.slotMin || 45) + '">' +
    '<div class="two"><div><label for="evBrk">Your break starts (optional)</label><input id="evBrk" type="time" step="900" value="' + esc(pad5(ev.breakStart || '')) + '"></div><div><label for="evBrkMin">Break minutes</label><input id="evBrkMin" inputmode="numeric" value="' + esc(ev.breakMin || 0) + '"></div></div>' +
    '<label style="margin-top:16px">Stretches with no appointments (optional)</label><p class="muted small" style="margin:0">For example the mall rush, when you would rather take walk-ups.</p><div id="evBlk"></div>' +
    '<div class="acts" style="margin-top:8px"><button class="sbtn" id="evAddBlk" type="button">Add a blocked stretch</button></div>' +
    '<label for="evNote">Note to yourself (optional)</label><input id="evNote" value="' + esc((d && d.mode === 'event' && d.note) || seed.note || '') + '">' +
    '<label for="evId">Link code (optional; days with the same code share one booking link)</label><input id="evId" autocapitalize="none" value="' + esc(ev.eventId || '') + '" placeholder="made from the venue name if left blank">' +
    (isNew ? '' : linkBox(ev.link)) +
    '<div class="row"><button class="btn" id="evSave">' + (isNew ? 'Add this event day' : 'Save event day') + '</button>' + (isNew ? '' : '<button class="btn ghost" id="evMore">Add another day of this event</button>') + '<button class="btn quiet" id="evBack">Cancel</button></div>' +
    (isNew ? '' : '<div class="row"><button class="sbtn warn" id="evRemove" type="button">Remove this event day</button></div>') + '<p class="err" id="evErr" hidden></p>');
  drawBlackouts(); wireLink(ev.link, ev.venue || 'Cutco event');
  document.getElementById('evBack').addEventListener('click', function () { plannerScreen(); });
  document.getElementById('evAddBlk').addEventListener('click', function () { syncBlackouts(); EVB.push({ start: '14:00', end: '15:00' }); drawBlackouts(); });
  function read() {
    syncBlackouts();
    var v = function (id) { var e2 = document.getElementById(id); return e2 ? e2.value.trim() : ''; };
    return { op: 'saveevent', date: isNew ? v('evDate') : d.date, venue: v('evVenue'), address: v('evAddr'), findMe: v('evFind'), start: v('evStart'), end: v('evEnd'), slotMin: v('evSlot'),
      breakStart: v('evBrk'), breakMin: v('evBrk') ? (v('evBrkMin') || '0') : '0', blackouts: EVB.map(function (b) { return { start: b.start, end: b.end }; }), note: v('evNote'), eventId: v('evId') };
  }
  var errEl = document.getElementById('evErr'); function err(m) { errEl.textContent = m; errEl.hidden = false; }
  document.getElementById('evSave').addEventListener('click', function () {
    var b = read();
    if (!b.date) return err('Pick the day.');
    if (!b.venue && !b.address) return err('Give the event a venue name or an address.');
    if (!b.start || !b.end || b.end <= b.start) return err('The day should end after the first appointment.');
    var btn = document.getElementById('evSave'); btn.disabled = true; btn.textContent = 'Saving';
    post(b).then(function (r) {
      if (!r.ok) { btn.disabled = false; btn.textContent = isNew ? 'Add this event day' : 'Save event day'; return err(r.error || 'Could not save the event.'); }
      PL = r; eventSavedScreen(r, b);
    }).catch(function () { btn.disabled = false; btn.textContent = isNew ? 'Add this event day' : 'Save event day'; err('Could not reach the engine.'); });
  });
  var more = document.getElementById('evMore'); if (more) more.addEventListener('click', function () { anotherDay(read()); });
  var rm = document.getElementById('evRemove'); if (rm) rm.addEventListener('click', function () { removeEventScreen(d); });
}
function nextDate(ds) { var p = ds.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2] + 1); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
function anotherDay(b, eventId) {
  eventScreen(null, { date: nextDate(b.date), start: b.start, end: b.end, note: '', event: { venue: b.venue, address: b.address, findMe: b.findMe, slotMin: b.slotMin, breakStart: b.breakStart, breakMin: b.breakMin, blackouts: b.blackouts, eventId: eventId || b.eventId } });
}
function eventSavedScreen(r, b) {
  var day = (r.days || []).filter(function (x) { return x.date === b.date; })[0];
  show('<h1>Event saved</h1><p class="ok">' + esc((day ? day.label : b.date) + (b.venue ? ' at ' + b.venue : '')) + ', ' + esc(t12(b.start) + ' to ' + t12(b.end)) + '.</p>' +
    (r.warn ? '<p class="err">' + esc(r.warn) + '</p>' : '') +
    '<p class="muted">Customers can book it now. Send them this link and it opens straight on this event.</p>' + linkBox(r.link) +
    '<div class="row"><button class="btn ghost" id="esMore">Add another day of this event</button><button class="btn quiet" id="esBack">Back to the planner</button></div>');
  wireLink(r.link, b.venue || 'Cutco event');
  document.getElementById('esBack').addEventListener('click', function () { plannerScreen('', r); });
  document.getElementById('esMore').addEventListener('click', function () { anotherDay(b, r.eventId); });
}
function removeEventScreen(d) {
  show('<h1>Remove this event day?</h1><p>' + esc(d.label) + (d.venue ? ' at ' + esc(d.venue) : '') + '. Customers will no longer be able to book it.</p>' +
    (d.booked ? '<p class="err">' + d.booked + ' already booked that day. Removing the event does not cancel them. Cancel or move each one from My schedule if the event is off.</p>' : '') +
    '<div class="row"><button class="btn" id="rmGo">Remove the event day</button><button class="btn quiet" id="rmBack">Keep it</button></div><p class="err" id="rmErr" hidden></p>');
  document.getElementById('rmBack').addEventListener('click', function () { eventScreen(d); });
  document.getElementById('rmGo').addEventListener('click', function () {
    post({ op: 'saveplan', date: d.date, mode: 'default', force: true }).then(function (r) { if (r.ok) return plannerScreen('Removed the event on ' + d.label + '.', r); var e2 = document.getElementById('rmErr'); e2.textContent = r.error || 'Could not remove it.'; e2.hidden = false; })
      .catch(function () { var e3 = document.getElementById('rmErr'); e3.textContent = 'Could not reach the engine.'; e3.hidden = false; });
  });
}
function weekScreen(msg) {
  var html = '<h1>My standard week</h1>' + (typeof msg === 'string' ? '<p class="ok">' + esc(msg) + '</p>' : '') + '<p class="muted">' + (PL.autoWeek ? 'What each weekday offers unless you change a particular date in the planner.' : 'Your usual pattern. Nothing here is open to customers until you tap "Use my standard week" on a week in the planner.') + '</p><div class="menu">';
  [1, 2, 3, 4, 5, 6, 0].forEach(function (i) {
    var w = PL.week[i];
    html += '<button class="item" data-wd="' + i + '"><div class="t"><span>' + esc(w.name) + '</span><span class="pill ' + esc(w.mode) + '">' + esc(MODE_NAME[w.mode] || w.mode) + '</span></div><div class="d">' + esc(dayLine(w)) + '</div></button>';
  });
  show(html + '</div><div class="row"><button class="btn quiet" id="wkBack">Back to the planner</button></div>');
  document.getElementById('wkBack').addEventListener('click', function () { plannerScreen(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-wd]'), function (el2) { el2.addEventListener('click', function () { weekdayScreen(PL.week[+el2.getAttribute('data-wd')]); }); });
}
function weekdayScreen(w) {
  show('<h1>Every ' + esc(w.name) + '</h1><p class="muted">Changing the pattern does not change weeks you have already opened.</p>' + planEditor(w, true) + '<div class="row"><button class="btn" id="wdSave">Save</button><button class="btn quiet" id="wdBack">Cancel</button></div><p class="err" id="wdErr" hidden></p>');
  wireEditor(w);
  document.getElementById('wdBack').addEventListener('click', function () { weekScreen(); });
  document.getElementById('wdSave').addEventListener('click', function () {
    var v = readEditor(), e2 = document.getElementById('wdErr'); if (v.error) { e2.textContent = v.error; e2.hidden = false; return; }
    v.op = 'savetemplate'; v.dow = w.dow;
    post(v).then(function (r) { if (!r.ok) { e2.textContent = r.error || 'Could not save.'; e2.hidden = false; return; } PL = r; weekScreen('Saved every ' + w.name + '.'); }).catch(function () { e2.textContent = 'Could not reach the engine.'; e2.hidden = false; });
  });
}
if (demo) document.body.appendChild(el('<div class="demo">Demo</div>'));
start();
</script>
